<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea es clave para que la página sea responsive en el celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro espacio | Fika Ritual</title>
  <meta name="description" content="Fika Ritual: cafetería de especialidad, restó y panadería artesanal en Del Viso, Pilar.">

  <!-- Tipografías de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== HEADER (igual en todas las páginas) ===== -->
  <header class="header">
    <div class="contenedor">
      <a href="index.html" class="logo" aria-label="Fika Ritual, ir al inicio">
        <span class="logo-fika">FIKA</span>
        <span class="logo-ritual">RITUAL</span>
      </a>

      <!-- Checkbox escondido: abre y cierra el menú en celular -->
      <input type="checkbox" id="menu-toggle" class="menu-toggle">

      <nav class="nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="menu.html">Menú</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="fika.html">Fika</a></li>
          <li><a href="espacio.html" class="activo">Espacio</a></li>
          <li><a href="info.html">Info</a></li>
          <li class="solo-celular"><a href="info.html#contacto">Contacto</a></li>
        </ul>
      </nav>

      <a href="info.html#contacto" class="boton boton-borde">Contacto</a>

      <!-- Botón hamburguesa (solo se ve en celular) -->
      <label for="menu-toggle" class="hamburguesa" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </label>
    </div>
  </header>

  <main>
    <!-- ===== INTRO ===== -->
    <section>
      <div class="contenedor espacio-intro">
        <div>
          <p class="etiqueta">Nuestro espacio</p>
          <span class="rayita" style="margin:0 0 12px"></span>
          <h1>Nuestro espacio</h1>
          <span class="rayita"></span>
          <a href="#ambientes" class="boton boton-terracota">Ver galería</a>
        </div>
        <img src="img/espacio-hero.jpg" alt="Salón de Fika con plantas colgantes, vitrina y lámparas de mimbre">
      </div>
    </section>

    <!-- ===== AMBIENTES ===== -->
    <section class="ambientes" id="ambientes">
      <div class="contenedor">
        <h2>Ambientes</h2>
        <p class="subtitulo">Diferentes espacios para cada momento del día.</p>
        <ul>
          <li>
            <div class="ambiente-foto"><img src="img/amigos.jpg" alt="Barra con plantas colgantes y lámparas cálidas"></div>
            <div class="icono-circulo"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="16" r="5"/><circle cx="31" cy="16" r="5"/><path d="M7 36c0-6 4-10 10-10s10 4 10 10H7z"/><path d="M27 27c1-.7 2.5-1 4-1 6 0 10 4 10 10H28"/></svg></div>
            <h3>Con amigos</h3>
          </li>
          <li>
            <div class="ambiente-foto"><img src="img/trabajar.jpg" alt="Mesas compartidas con gente trabajando en laptops"></div>
            <div class="icono-circulo"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="12" width="28" height="18" rx="1.5"/><path d="M5 34h38l-2 4H7z"/></svg></div>
            <h3>Para trabajar</h3>
          </li>
          <li>
            <div class="ambiente-foto"><img src="img/estudiar.jpg" alt="Patio con sillones y gente leyendo"></div>
            <div class="icono-circulo"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 14c-4-3-10-4-16-3v24c6-1 12 0 16 3 4-3 10-4 16-3V11c-6-1-12 0-16 3z"/><path d="M24 14v24"/></svg></div>
            <h3>Para estudiar</h3>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Fika Ritual &middot; Del Viso, Pilar</p>
  </footer>

</body>
</html>
